services:

  db:
    image: mariadb:11
    container_name: pokemon_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/init/02_pokemons.sql:/docker-entrypoint-initdb.d/02_pokemons.sql:ro
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    expose:
      - "3306"

  api:
    build: .
    container_name: pokemon_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - pokemon_images:/app/static/images
    networks:
      - pokemon-network
    depends_on:
      db:
        condition: service_healthy

networks:
  pokemon-network:
    driver: bridge

volumes:
  mysql_data:
  pokemon_images: