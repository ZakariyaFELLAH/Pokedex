<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="pokedex.png" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-ball"></div>
        <span class="logo-text">Pokédex</span>
      </div>
      <div class="search-wrapper">
        <input type="text" id="search" class="search-input" placeholder="Rechercher..." autocomplete="off" />
        <span class="search-icon">🔍</span>
      </div>
      <button class="btn-add" id="btn-add">+ Ajouter</button>
      <div class="music-ctrl" style="margin-left:auto">
        <button class="btn-music" id="btn-music" onclick="toggleBg()" title="Musique on/off">
          <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.4" title="Volume musique" />
      </div>
    </div>
  </header>

  <!-- Filtres -->
  <section class="filters-section">
    <div class="filters-inner">
      <button class="filter-btn active" data-type="all">Tous</button>
    </div>
  </section>

  <!-- Compteur -->
  <div class="counter" id="counter">Chargement...</div>

  <!-- Grille -->
  <main class="grid" id="pokemon-grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>

  <!-- Modal Détail -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Modal Ajout -->
  <div class="modal-overlay" id="add-overlay">
    <div class="modal-add">
      <button class="modal-close" id="add-close">✕</button>
      <p class="form-title">Nouveau Pokémon</p>
      <form id="add-form" autocomplete="off">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Numéro *</label>
            <input class="form-input" name="id_pokemon" type="number" min="1" placeholder="001" required />
          </div>
          <div class="form-group">
            <label class="form-label">Nom *</label>
            <input class="form-input" name="poke_name" type="text" placeholder="Bulbizarre" required />
          </div>
          <div class="form-group">
            <label class="form-label">Total</label>
            <input class="form-input" name="total" type="number" min="0" placeholder="318" required />
          </div>
          <div class="form-group">
            <label class="form-label">HP</label>
            <input class="form-input" name="hp" type="number" min="0" placeholder="45" required />
          </div>
          <div class="form-group">
            <label class="form-label">Attaque</label>
            <input class="form-input" name="attack" type="number" min="0" placeholder="49" required />
          </div>
          <div class="form-group">
            <label class="form-label">Défense</label>
            <input class="form-input" name="defense" type="number" min="0" placeholder="49" required />
          </div>
          <div class="form-group">
            <label class="form-label">Att. Spé</label>
            <input class="form-input" name="attack_special" type="number" min="0" placeholder="65" required />
          </div>
          <div class="form-group">
            <label class="form-label">Déf. Spé</label>
            <input class="form-input" name="defense_special" type="number" min="0" placeholder="65" required />
          </div>
          <div class="form-group">
            <label class="form-label">Vitesse</label>
            <input class="form-input" name="speed" type="number" min="0" placeholder="45" required />
          </div>
          <div class="form-group">
            <label class="form-label">Évolution ID</label>
            <input class="form-input" name="evolution_id" type="number" min="1" placeholder="002 (optionnel)" />
          </div>
          <div class="form-group full">
            <label class="form-label">Image PNG</label>
            <label class="upload-zone" id="upload-zone" for="image_file">
              <div class="upload-zone-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary)">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span id="upload-label" style="font-size:0.82rem;color:var(--text-secondary);margin-top:0.4rem">Glisser ou cliquer pour choisir un PNG</span>
                <img id="img-preview" src="" alt="preview" style="display:none;width:90px;height:90px;object-fit:contain;border-radius:10px;margin-top:0.5rem" />
              </div>
              <input type="file" id="image_file" name="image_file" accept=".png" style="display:none" />
            </label>
          </div>
          <div class="form-group full">
            <label class="form-label">Types</label>
            <div class="type-selector">
              <label class="type-pill" style="--tc:#ff6b35"><input type="checkbox" name="type" value="fire" /><span>🔥 Fire</span></label>
              <label class="type-pill" style="--tc:#4a90e2"><input type="checkbox" name="type" value="water" /><span>💧 Water</span></label>
              <label class="type-pill" style="--tc:#5cb85c"><input type="checkbox" name="type" value="grass" /><span>🌿 Grass</span></label>
              <label class="type-pill" style="--tc:#f5c518"><input type="checkbox" name="type" value="electric" /><span>⚡ Electric</span></label>
              <label class="type-pill" style="--tc:#e91e8c"><input type="checkbox" name="type" value="psychic" /><span>🔮 Psychic</span></label>
              <label class="type-pill" style="--tc:#74d7d7"><input type="checkbox" name="type" value="ice" /><span>❄️ Ice</span></label>
              <label class="type-pill" style="--tc:#7038f8"><input type="checkbox" name="type" value="dragon" /><span>🐉 Dragon</span></label>
              <label class="type-pill" style="--tc:#5a4a6b"><input type="checkbox" name="type" value="dark" /><span>🌑 Dark</span></label>
              <label class="type-pill" style="--tc:#f4a7c3"><input type="checkbox" name="type" value="fairy" /><span>🧚 Fairy</span></label>
              <label class="type-pill" style="--tc:#9a9a9a"><input type="checkbox" name="type" value="normal" /><span>⚪ Normal</span></label>
              <label class="type-pill" style="--tc:#c03028"><input type="checkbox" name="type" value="fighting" /><span>🥊 Fighting</span></label>
              <label class="type-pill" style="--tc:#89aadd"><input type="checkbox" name="type" value="flying" /><span>🕊️ Flying</span></label>
              <label class="type-pill" style="--tc:#a040a0"><input type="checkbox" name="type" value="poison" /><span>☠️ Poison</span></label>
              <label class="type-pill" style="--tc:#e0c068"><input type="checkbox" name="type" value="ground" /><span>🌍 Ground</span></label>
              <label class="type-pill" style="--tc:#b8a038"><input type="checkbox" name="type" value="rock" /><span>🪨 Rock</span></label>
              <label class="type-pill" style="--tc:#a8b820"><input type="checkbox" name="type" value="bug" /><span>🐛 Bug</span></label>
              <label class="type-pill" style="--tc:#705898"><input type="checkbox" name="type" value="ghost" /><span>👻 Ghost</span></label>
              <label class="type-pill" style="--tc:#b8b8d0"><input type="checkbox" name="type" value="steel" /><span>⚙️ Steel</span></label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-submit">Ajouter le Pokémon</button>
        <p class="form-msg" id="form-msg"></p>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
